name: Deploy Web App to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. Empaqueter les fichiers statiques de l'application Web
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Cloner le Référentiel
        uses: actions/checkout@v4

      - name: ⚙️ Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Uploader le dossier Web (assets/www)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'app/src/main/assets/www'

  # 2. Déployer l'artefact sur GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🚀 Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
