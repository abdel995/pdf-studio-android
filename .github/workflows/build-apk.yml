name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Cloner le Référentiel
        uses: actions/checkout@v4

      - name: ☕ Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🔧 Accorder les permissions d'exécution à gradlew
        run: chmod +x gradlew

      - name: 🚀 Compiler l'APK Android (Debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: 📦 Renommer l'APK pour le téléchargement
        run: |
          mkdir -p build-artifacts
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} build-artifacts/PDF-Studio-Pro.apk \;

      - name: 📤 Uploader l'APK dans les Artifacts GitHub
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-Pro-APK
          path: build-artifacts/PDF-Studio-Pro.apk
          retention-days: 60

      - name: 🏷️ Créer une Release GitHub Automatique
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/PDF-Studio-Pro.apk
          name: "PDF Studio Pro Mobile ${{ github.ref_name }}"
          body: |
            ## 🎉 PDF Studio Pro pour Android
            
            Application mobile autonome de traitement et manipulation de fichiers PDF.
            
            ### 📱 Téléchargement et Installation :
            1. Téléchargez le fichier **PDF-Studio-Pro.apk** ci-dessous.
            2. Ouvrez le fichier sur votre appareil Android et autorisez l'installation depuis vos fichiers.
            3. Profitez de tous vos outils PDF directement sur votre smartphone 100% hors-ligne !
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
